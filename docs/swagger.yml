openapi: 3.0.3

info:
  title: Api de prueba
  version: 1.0.0
  description: Documentación de los endpoints

servers:
  - url: https://render-conection-express.onrender.com
    description: Producción

  - url: http://localhost:3000
    description: Desarrollo

tags:
  - name: User
    description: Endpoint relacionado con Users

  - name: Sanitize
    description: Endpoint relacionado con la sanitización de datos

  - name: Test
    description: Endpoint de prueba

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserCreateRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: swagger@hotmail.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 16
          example: '12345678'
    UserResponse:
      type: object
      properties:
        id_user:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: swagger@hotmail.com
        role:
          type: string
          enum:
            - user
            - admin
          example: user

paths:
  /api/users:
    get:
      tags:
        - User
      summary: Obtener usuarios
      description: Retornar una lista con todos los usuarios
      responses:
        '200':
          description: Consulta realizada con exito. Puede retornar una lista vacia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

    put:
      tags:
        - User
      summary: Actualizar usuarios
      description: Actualizar todos los usuarios que cumplan la condición de busqueda
      responses:
        '204':
          description: Usuario actualizado. No retorna nada

  /api/users/{id}:
    get:
      tags:
        - User
      summary: Obtener usuario por su id
      description: Retornar el objeto json del usuario por el ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado

  /api/users/register:
    post:
      tags:
        - User
      summary: Crear un usuario
      description: Registra un usuario nuevo. El rol se asigna automaticamente como user
      requestBody:
        required: true
        description: Datos necesarios para crear un usuario
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email unico del usuario
                  example: swagger@hotmail.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 16
                  description: La contraseña debe contener entre 8 y 16 caracteres
                  example: '12345678'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Usuario creado
                  details:
                    type: object
                    properties:
                      id_user:
                        type: integer
                        example: 1
                      email:
                        type: string
                        example: swagger@hotmail.com
                      role:
                        type: string
                        example: user
        '400':
          description: Error de validacion
        '409':
          description: Error de Email Unico
        '500':
          description: Error del servidor

  /api/users/admin:
    get:
      tags:
        - User
      summary: Acceder a ruta admin
      description: Ruta de testeo para probar las credenciales de JWT
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bienvenido admin

  /api/test/sum:
    $ref: './paths/test.yml#/testSum'
